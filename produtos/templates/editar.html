{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar produto</title>
    <link rel="stylesheet" href="{% static 'produtos/style.css' %}">
</head>
<body>

    <header>
        <div class="topo">
            <a class="logo" href="/produtos">📦 Estoque</a>
            <nav>
                <a href="/home" {% if request.path == '/home' %}class="ativo"{% endif %}>Cadastro</a>
                <a href="/produtos" {% if request.path == '/produtos' %}class="ativo"{% endif %}>Produtos</a>
                <a href="/dashboard" {% if request.path == '/dashboard' %}class="ativo"{% endif %}>Dashboard</a>
                <a href="/carrinho" {% if request.path == '/carrinho' %}class="ativo"{% endif %}>🛒 Carrinho ({{ request.session.carrinho|length }})</a>
            </nav>
        </div>
    </header>

    <main class="estreito">
        {% if messages %}
            {% for mensagem in messages %}
                <p class="mensagem {{ mensagem.tags }}">{{ mensagem }}</p>
            {% endfor %}
        {% endif %}

        <div class="titulo">
            <h1>Editar produto</h1>
            <p>Altere os dados e salve</p>
        </div>

        <section class="card">
            <form method='post'>

                {% csrf_token %}

                <div class="campos">
                    {{ form }}
                </div>

                <div class="acoes-form">
                    <button class="botao">Salvar</button>
                    <a class="botao botao-claro" href="/produtos">Voltar</a>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
